services:
  - type: web
    name: networth-tracker
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_DIR
        value: /data
    disk:
      name: networth-data
      mountPath: /data
      sizeGB: 1
